paths:
  train_jsonl: data/train.jsonl
  val_jsonl:   data/val.jsonl
  out_dir:     runs/checkpoints/titan_v0

model:
  d: 512
  n_blocks: 36
  tokenizer: tokenizer_local_200k

run:
  steps: 25000                 # total updates
  batch_size: 32
  sequence_length: 128
  learning_rate: 1.0e-4        # LR peak
  # --- automation knobs (only used if explicit values not provided) ---
  warmup_percent: 0.10         # => warmup_steps = round(steps * warmup_percent) if warmup_steps is empty
  min_lr_percent: 0.06         # => min_learning_rate = learning_rate * min_lr_percent if min_learning_rate is empty
  # --- explicit overrides (optional) ---
  # warmup_steps:
  # min_learning_rate:

  weight_decay: 0.1
  grad_accumulation: 1
  amp: true
  ema: false
  ema_decay: 0.999
  log_every: 2
  eval_every: 500
  save_every: 1000
  device: cuda
  dtype: fp16                  # fp16 | bf16 | fp32
  num_workers: 0               # Windows-safe
  resume_from: null #runs/checkpoints/titan_v0/titan_step8000.pt
  seed: 42                   # optional, for reproducibility
