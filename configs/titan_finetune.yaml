paths:
  train_jsonl: Titan80M_Dataset/train.jsonl
  val_jsonl:   Titan80M_Dataset/val.jsonl
  out_dir:     runs/checkpoints/titan80m_lora

model:
  tokenizer: tokenizer_local_200k

run:
  steps: 60000
  batch_size: 32
  sequence_length: 512
  learning_rate: 7.0e-4
  warmup_percent: 0.03
  min_lr_percent: 0.10
  grad_accumulation: 4
  device: cuda
  dtype: bf16
  amp: true
  grad_clip: 1.0
  log_every: 5
  eval_every: 1000
  save_every: 1000
  eval_limit: 1024
  num_workers: 2
  resume_from: null # runs/checkpoints/titan80m_lora/titan80m_step0000.pt

lora:
  rank: 16
  alpha: 32
  dropout: 0.05
  quantize: true
