paths:
  train_jsonl: data/train.jsonl
  val_jsonl:   data/val.jsonl
  out_dir:     runs/checkpoints/titan_lora

model:
  tokenizer: tokenizer_local_200k

run:
  steps: 20
  batch_size: 4
  sequence_length: 32
  learning_rate: 5.0e-5
  grad_accumulation: 1
  device: cpu
  dtype: fp32
  amp: false
  grad_clip: 1.0
  log_every: 2
  eval_every: 10
  save_every: 2
  num_workers: 0

lora:
  rank: 4
  alpha: 8
  dropout: 0.0
  quantize: false
