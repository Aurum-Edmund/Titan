paths:
  train_jsonl: data/train.jsonl
  val_jsonl:   data/val.jsonl
  out_dir:     runs/checkpoints/titan_lora_smoketest

model:
  tokenizer: tokenizer_local_200k

run:
  steps: 4
  batch_size: 2
  sequence_length: 32
  learning_rate: 5.0e-4
  grad_accumulation: 1
  device: cuda
  dtype: fp16
  amp: true
  grad_clip: null
  log_every: 1
  eval_every: 1
  save_every: 1 
  eval_limit: 100
  num_workers: 0

lora:
  rank: 4
  alpha: 8
  dropout: 0.0
  quantize: false
